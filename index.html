<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0091ff" />

    <title>Tributes — links, tips, and live spins</title>
    <meta
      name="description"
      content="Tributes gives creators one page for links, one-time tips, and paid live spins on stream."
    />

    <!-- SVG first for browsers that take it, .ico behind for those that do
         not. The touch icon is separate because a home screen composites it on
         an opaque tile, so it carries its own background rather than going
         black where this one is transparent. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tributes" />
    <meta property="og:title" content="Tributes — links, tips, and live spins" />
    <meta
      property="og:description"
      content="Tributes gives creators one page for links, one-time tips, and paid live spins on stream."
    />
    <meta property="og:url" content="https://tributes.bio" />
    <meta property="og:image" content="https://tributes.bio/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tributes — a spin wheel, running total, and goal bar over a stream"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
